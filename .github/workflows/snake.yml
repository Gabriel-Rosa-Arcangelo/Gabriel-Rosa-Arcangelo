name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # todo dia 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Gabriel-Rosa-Arcangelo
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" publish -- --branch output --single-branch
          cp dist/*.svg publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push origin output
